# Fabrica la versión portable para Windows (carpeta con Chorusly.exe, sin instalar nada) y comprueba que arranca.
# Cuando sube la versión de package.json, la publica sola en «Releases» para descargarla.
name: Chorusly.exe
on:
  push:
    branches: [main, 'prueba-*'] # prueba-*: fabrica y comprueba, pero no publica nada
  workflow_dispatch: # también se puede lanzar a mano (o desde otra tarea de GitHub)
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fabricar Chorusly.exe
        shell: bash
        run: |
          curl -sSfL -o build/rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          node build/make-exe.js dist/Chorusly
      - name: Fabricar el icono de la bandeja
        shell: pwsh
        run: |
          $o = & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 /win32icon:build\bandeja.ico /out:dist\Chorusly\ChoruslyBandeja.exe build\bandeja.cs 2>&1
          if ($LASTEXITCODE -ne 0) { $o | ForEach-Object { "::error::$_" }; throw "No se pudo compilar el icono de la bandeja" }
      - name: Montar la carpeta portable
        shell: bash
        run: |
          cp server.js panel.html widgets.html overlay.html package.json package-lock.json "Comprobar Chorusly.bat" dist/Chorusly/
          cp -r logos fonts dist/Chorusly/
          cd dist/Chorusly && npm ci --omit=dev
      - name: Comprobar que arranca, responde y no abre ventana negra
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("dist/Chorusly/Chorusly.exe"); $pe = [BitConverter]::ToInt32($b, 0x3c)
          if ([BitConverter]::ToUInt16($b, $pe + 92) -ne 2) { throw "Chorusly.exe abriría una consola" }
          Start-Process dist/Chorusly/Chorusly.exe -WorkingDirectory dist/Chorusly
          Start-Sleep 8
          $r = Invoke-WebRequest http://localhost:8787/config -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "Chorusly no responde" }
          Get-Content dist/Chorusly/chorusly.log
          if (-not (Get-Process ChoruslyBandeja -ErrorAction SilentlyContinue)) { throw "No aparece el icono de la bandeja" }
          Invoke-WebRequest -Method POST http://localhost:8787/quit -UseBasicParsing | Out-Null
          Start-Sleep 12
          if (Get-Process ChoruslyBandeja -ErrorAction SilentlyContinue) { throw "El icono de la bandeja no se quita al cerrar Chorusly" }
          Remove-Item dist/Chorusly/chorusly.log -ErrorAction SilentlyContinue
      # «Comprobar Chorusly.bat», como al hacer doble clic con Chorusly cerrado: debe abrirlo y dar todo bien
      - name: Comprobar Chorusly.bat
        shell: cmd
        timeout-minutes: 2
        run: set CHORUSLY_SIN_PAUSA=1& call "dist\Chorusly\Comprobar Chorusly.bat" > dist\comprobar.txt 2>&1
      - name: Resultado de Comprobar Chorusly.bat
        if: always()
        shell: bash
        run: |
          echo "::notice::$(grep -v '^\s*$' dist/comprobar.txt | tr -d '\r' | tr '\n' '|')"
          curl -s -X POST http://localhost:8787/quit > /dev/null || true; sleep 3
          grep -q 'lo abro' dist/comprobar.txt && grep -q 'Todo funciona correctamente' dist/comprobar.txt
          rm -f dist/comprobar.txt dist/Chorusly/chorusly.log
      - name: Comprimir (carpeta Chorusly dentro del zip)
        shell: pwsh
        run: Compress-Archive -Path dist/Chorusly -DestinationPath dist/Chorusly.zip
      - name: Fabricar el instalador (Chorusly-Instalador.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = node -p "require('./package.json').version"
          $o = & $iscc /Q "/DVersion=$v" "/DSource=..\dist\Chorusly" build\instalador.iss 2>&1
          if ($LASTEXITCODE -ne 0) { "::error::$($o -join ' | ')"; throw "No se pudo fabricar el instalador" }
      - name: Comprobar el instalador (instala sin preguntas, arranca, desinstala)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\ChoruslyPrueba"
          Start-Process dist\Chorusly-Instalador.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait
          foreach ($f in 'Chorusly.exe','ChoruslyBandeja.exe','server.js','panel.html','fonts\bricolage-grotesque.woff2','Chorusly Widgets.url','unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { "::error::El instalador no ha puesto $f"; throw "Falta $f" } }
          Start-Process "$dir\Chorusly.exe" -WorkingDirectory $dir; Start-Sleep 8
          if ((Invoke-WebRequest http://localhost:8787/config -UseBasicParsing).StatusCode -ne 200) { throw "Chorusly instalado no responde" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait; Start-Sleep 3
          if (Test-Path "$dir\Chorusly.exe") { "::error::La desinstalación ha dejado archivos"; throw "No se ha desinstalado" }
          "::notice::Instalador comprobado: instala, arranca y se desinstala"
      - uses: actions/upload-artifact@v4
        with: { name: Chorusly-portable, path: dist/Chorusly.zip }
      - uses: actions/upload-artifact@v4
        with: { name: Chorusly-instalador, path: dist/Chorusly-Instalador.exe }
      - name: Publicar en Releases (solo si la versión es nueva)
        if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ordenar]')" # solo main publica; «[ordenar]» publica con «Ordenar versiones»
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="v$(node -p "require('./package.json').version")"
          # título y explicación: los del commit si empieza por «Chorusly 1.N …» (primera línea y resto)
          git log -1 --format=%s > ../titulo.txt; { git log -1 --format=%b | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' || true; } > ../notas.txt
          printf '\n**Cómo usarlo:** descarga **Chorusly-Instalador.exe** y ábrelo. Si prefieres no instalar nada, descarga Chorusly.zip, descomprímelo y abre Chorusly.exe.\n' >> ../notas.txt
          S=${V#v}; S=${S%.0}  # 1.4.0 → 1.4, como en el título del commit
          T=$(cat ../titulo.txt); case "$T" in "Chorusly $S "*) ;; *) T="Chorusly $V";; esac
          if gh release view "$V" > /dev/null 2>&1; then
            # ya publicada: si este commit es el de la versión, pone al día su título y explicación
            if [ "$T" != "Chorusly $V" ]; then gh release edit "$V" --title "$T" --notes-file ../notas.txt; fi
            echo "$V ya estaba publicada"; exit 0
          fi
          gh release create "$V" dist/Chorusly.zip dist/Chorusly-Instalador.exe --target "$GITHUB_SHA" --title "$T" --notes-file ../notas.txt
